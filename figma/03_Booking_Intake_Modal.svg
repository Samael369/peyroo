<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" fill="none" style="background:#FAF8F5;">
  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .f-bold { font-weight: 700; }
    .f-semibold { font-weight: 600; }
    .f-medium { font-weight: 500; }
  </style>

  <!-- BACKGROUND OVERLAY -->
  <rect width="1440" height="960" fill="#16222F" opacity="0.6"/>

  <!-- ========================================================================= -->
  <!-- MODAL CONTAINER (600 x 680 Centered at x=420, y=140)                      -->
  <!-- ========================================================================= -->
  <g id="Booking_Modal" transform="translate(420, 140)">
    
    <!-- Modal Surface Card -->
    <rect width="600" height="680" rx="32" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1" filter="drop-shadow(0 20px 40px rgba(22,34,47,0.15))"/>

    <!-- Close button (Top Right) -->
    <circle cx="550" cy="50" r="16" fill="#FAF8F5"/>
    <text x="550" y="55" font-size="14" fill="#697380" text-anchor="middle">✕</text>

    <!-- Modal Header (Left-aligned from x=48) -->
    <g transform="translate(48, 48)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="#FAF6F0" stroke="#EBDCCF" stroke-width="1"/>
      <text x="90" y="16" font-size="10" font-weight="700" fill="#C86D3B" class="f-sans" text-anchor="middle">STEP 2 OF 2: INTAKE DETAILS</text>
      
      <text x="0" y="50" font-size="22" font-weight="800" fill="#16222F" class="f-sans" text-anchor="start">Confirm Mentorship Session</text>
      <text x="0" y="74" font-size="12" font-weight="400" fill="#5A6472" class="f-sans" text-anchor="start">Sharing your goal and questions beforehand ensures maximum impact during your call.</text>
    </g>

    <!-- Session Summary Box (504px width at x=48, y=148) -->
    <g transform="translate(48, 148)">
      <rect width="504" height="96" rx="20" fill="#FAF8F5" stroke="#E5DFD5" stroke-width="1"/>
      
      <circle cx="48" cy="48" r="24" fill="#16222F"/>
      <text x="48" y="55" font-size="13" font-weight="800" fill="#FFFFFF" class="f-sans" text-anchor="middle">AM</text>

      <g transform="translate(90, 22)">
        <text x="0" y="16" font-size="14" font-weight="800" fill="#16222F" class="f-sans" text-anchor="start">Session with Arash Moradi</text>
        <text x="0" y="36" font-size="12" font-weight="500" fill="#4F5966" class="f-sans" text-anchor="start">Topic: System Design &amp; Architecture Teardown (45m)</text>
        <text x="0" y="56" font-size="11" font-weight="700" fill="#C86D3B" class="f-sans" text-anchor="start">Thursday, Nov 05, 2026 • 14:00 — 14:45 (Local Time)</text>
      </g>
    </g>

    <!-- Form Question 1: Discussion Goal -->
    <g transform="translate(48, 268)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#16222F" class="f-sans" text-anchor="start">What specific challenge or discussion goal do you want to cover? *</text>
      <rect x="0" y="12" width="504" height="110" rx="16" fill="#FAF8F5" stroke="#DDD7CD" stroke-width="1"/>
      <text x="18" y="38" font-size="11" font-weight="400" fill="#16222F" class="f-sans" text-anchor="start">We are redesigning our payment ledger pipeline and weighing Saga vs Two-Phase Commit.</text>
      <text x="18" y="58" font-size="11" font-weight="400" fill="#16222F" class="f-sans" text-anchor="start">I'd love feedback on idempotency and failure recovery patterns under high throughput.</text>
    </g>

    <!-- Form Question 2: Artifacts / Repo Link -->
    <g transform="translate(48, 416)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#16222F" class="f-sans" text-anchor="start">Architecture diagram, portfolio, or repo link (Optional)</text>
      <rect x="0" y="12" width="504" height="46" rx="16" fill="#FAF8F5" stroke="#DDD7CD" stroke-width="1"/>
      <text x="18" y="40" font-size="11" font-weight="500" fill="#4F5966" class="f-sans" text-anchor="start">https://github.com/myteam/distributed-payment-service</text>
    </g>

    <!-- Google Meet Info Callout -->
    <g transform="translate(48, 492)">
      <rect width="504" height="54" rx="16" fill="#FAF6F0" stroke="#EBDCCF" stroke-width="1"/>
      <text x="18" y="24" font-size="11" font-weight="700" fill="#C86D3B" class="f-sans" text-anchor="start">✦ Meeting Infrastructure:</text>
      <text x="18" y="42" font-size="10" font-weight="500" fill="#5A6472" class="f-sans" text-anchor="start">A unique Google Meet room link will be generated in your dashboard and emailed to you.</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(48, 574)">
      <line x1="0" y1="0" x2="504" y2="0" stroke="#F0EBE2" stroke-width="1"/>
      
      <!-- Cancel Button -->
      <rect x="0" y="24" width="150" height="48" rx="24" fill="#FAF8F5" stroke="#DDD7CD" stroke-width="1"/>
      <text x="75" y="53" font-size="12" font-weight="600" fill="#4F5966" class="f-sans" text-anchor="middle">Cancel</text>

      <!-- Submit CTA Button -->
      <rect x="165" y="24" width="339" height="48" rx="24" fill="#C86D3B"/>
      <text x="334" y="53" font-size="13" font-weight="700" fill="#FFFFFF" class="f-sans" text-anchor="middle">Confirm &amp; Reserve Session (45m)</text>
    </g>

  </g>

</svg>
